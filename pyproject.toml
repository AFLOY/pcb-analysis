[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-analysis"
version = "0.8.1"
description = "CUDA-accelerated PEEC, matrix-free FEM, and radiated-emission evaluation for electrical, thermal, and EMC PCB analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Hiroyuki Yamada", email = "H44bcda@gmail.com" },
]
keywords = ["peec", "fem", "maxwell", "skin-effect", "thermal", "heat-conduction", "emc", "radiated-emission", "near-field", "multiphysics", "electrothermal", "pcb", "pdn", "electromagnetics", "cuda", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.4",
  "scipy>=1.11,<1.18",
  # STEP input (OpenCASCADE) and the 3D voxel PEEC are part of the package,
  # pinned here so every install resolves the same versions.
  "cadquery-ocp>=8.0,<9",
  "pypeec==5.8.0",
]

[project.optional-dependencies]
# CuPy is the only optional runtime: it needs an NVIDIA driver and has no
# macOS wheel.  Every CUDA path falls back to the CPU without it.
cuda = ["cupy-cuda13x>=14,<15"]
test = ["pytest>=8,<9"]
native = ["pybind11>=2.12,<4"]
# Kept for installs written against 0.7.0; the CAD reader is now included.
cad = []

[project.urls]
Homepage = "https://github.com/AFLOY/pcb-analysis"
Repository = "https://github.com/AFLOY/pcb-analysis"
Issues = "https://github.com/AFLOY/pcb-analysis/issues"

[project.scripts]
pcb-analysis-calibrate = "electrical.dice_peec.cli.calibrate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["electrical*", "thermal*", "emc*", "multiphysics*", "geometry*"]

[tool.setuptools.package-data]
electrical = ["py.typed", "matrix_free_mpir_fem/native/*.cpp", "sheet_peec/native/*.cpp"]
thermal = ["py.typed", "matrix_free_mpir_fem/native/*.cpp"]
emc = ["py.typed", "tiled_dipole_superposition/native/*.cpp"]
multiphysics = ["py.typed"]
geometry = ["py.typed", "cad_import/native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exercise the src-layout packages directly while keeping local experiment
# modules importable from the repository root.
pythonpath = ["src", "."]
