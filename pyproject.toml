[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-analysis"
version = "0.6.0"
description = "CUDA-accelerated PEEC, matrix-free FEM, and radiated-emission evaluation for electrical, thermal, and EMC PCB analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Hiroyuki Yamada", email = "H44bcda@gmail.com" },
]
keywords = ["peec", "fem", "maxwell", "skin-effect", "thermal", "heat-conduction", "emc", "radiated-emission", "near-field", "multiphysics", "electrothermal", "pcb", "pdn", "electromagnetics", "cuda", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.4",
  "scipy>=1.11,<1.18",
]

[project.optional-dependencies]
cuda = [
  "cupy-cuda13x>=14,<15",
  "pypeec==5.8.0",
]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/AFLOY/pcb-analysis"
Repository = "https://github.com/AFLOY/pcb-analysis"
Issues = "https://github.com/AFLOY/pcb-analysis/issues"

[project.scripts]
pcb-analysis-calibrate = "electrical.dice_peec.cli.calibrate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["electrical*", "thermal*", "emc*", "multiphysics*"]

[tool.setuptools.package-data]
electrical = ["py.typed"]
thermal = ["py.typed"]
emc = ["py.typed"]
multiphysics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exercise the src-layout packages directly while keeping local experiment
# modules importable from the repository root.
pythonpath = ["src", "."]
