[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peec-fastopt"
version = "0.1.0"
description = "CUDA acceleration and adaptive execution for PCB PEEC optimization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.4",
  "scipy>=1.11,<1.18",
]

[project.optional-dependencies]
cuda = [
  "cupy-cuda13x>=14,<15",
  "pypeec==5.8.0",
]
test = ["pytest>=8,<9"]

[project.scripts]
peec-cuda-calibrate = "peec_fastopt.cuda_calibrate:main"
peec-cuda-benchmark = "peec_fastopt.plane_opt_benchmark:main"

[tool.setuptools.packages.find]
include = ["peec_fastopt*"]
