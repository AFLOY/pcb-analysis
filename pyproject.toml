[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peec-fastopt"
version = "0.1.0"
description = "CUDA-accelerated PEEC solver for PCB PDN optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Hiroyuki Yamada", email = "H44bcda@gmail.com" },
]
dependencies = [
  "numpy>=1.26,<2.4",
  "scipy>=1.11,<1.18",
]

[project.optional-dependencies]
cuda = [
  "cupy-cuda13x>=14,<15",
  "pypeec==5.8.0",
]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/AFLOY/peec-cuda"
Repository = "https://github.com/AFLOY/peec-cuda"
Issues = "https://github.com/AFLOY/peec-cuda/issues"

[project.scripts]
peec-cuda-calibrate = "examples.cuda_calibrate:main"
peec-cuda-benchmark = "examples.plane_opt_benchmark:main"

[tool.setuptools.packages.find]
include = ["peec_fastopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
