name: Release

# Builds the wheel and source distribution once, checks them, installs the
# wheel into a clean environment, then uploads them to PyPI with Trusted
# Publishing (OIDC) and attaches them to the GitHub release that triggered
# the run.  No API token is stored in the repo.
#
# PyPI side, done once: register this repository as a trusted publisher on
# PyPI for project "pcb-analysis" with workflow "release.yml" and environment
# "pypi"; the same on TestPyPI with environment "testpypi".  On GitHub,
# create the "pypi" and "testpypi" environments under Settings > Environments.
#
# A manual run uploads to TestPyPI by default so a release can be rehearsed;
# choose "pypi" to publish by hand.  Neither manual target touches a GitHub
# release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with the oldest supported setuptools
        run: |
          python -m pip install --upgrade pip
          pip install 'setuptools==69.*' wheel build twine
          python -m build --no-isolation
          twine check --strict dist/*

      - name: Confirm the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Install the wheel into a clean environment and import it
        working-directory: /tmp
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install --upgrade pip
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python -c "
          import electrical.dice_peec, electrical.matrix_free_mpir_fem
          import thermal.matrix_free_mpir_fem, emc.tiled_dipole_superposition
          import multiphysics.staggered_coupling, geometry.step_voxelize
          from importlib.resources import files
          for package in ('electrical', 'thermal', 'emc', 'multiphysics', 'geometry'):
              assert files(package).joinpath('py.typed').is_file(), package
          # The wheel is pure Python: C++ sources ship, compiled objects do not.
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob('$GITHUB_WORKSPACE/dist/*.whl')[0]).namelist()
          assert any(n.endswith('point_in_mesh.cpp') for n in names)
          assert not any(n.endswith('.so') for n in names)
          "
          wheel-env/bin/pcb-analysis-calibrate --help > /dev/null

      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pcb-analysis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The checksum file is a release asset, not a distribution.
      - run: rm -f dist/SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pcb-analysis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: rm -f dist/SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
