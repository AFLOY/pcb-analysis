name: Publish to PyPI

# Builds the wheel and source distribution once, checks them, and uploads them
# with PyPI Trusted Publishing (OIDC) -- no API token is stored in the repo.
# Runs when a GitHub release is published, or by hand for a dry run to
# TestPyPI.  Before the first run, register this repository as a pending
# publisher on PyPI: project "pcb-analysis", workflow "publish.yml",
# environment "pypi" (and the same on TestPyPI with environment "testpypi").
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with the oldest supported setuptools
        run: |
          python -m pip install --upgrade pip
          pip install 'setuptools==69.*' wheel build twine
          python -m build --no-isolation
          twine check dist/*

      - name: Confirm the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Install the wheel into a clean environment and import it
        working-directory: /tmp
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install --upgrade pip
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python -c "import electrical.dice_peec, electrical.matrix_free_mpir_fem"
          wheel-env/bin/pcb-analysis-calibrate --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pcb-analysis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pcb-analysis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
