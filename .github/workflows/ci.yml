name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,native]'

      - name: Build the native extensions
        # Built in place so the native tests run instead of being skipped;
        # the wheel job below still ships the sources only.
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)"
          cmake --build build/native
          python -c "
          import thermal.matrix_free_mpir_fem.native_hex as t
          import emc.tiled_dipole_superposition.native_dipole as e
          import electrical.matrix_free_mpir_fem.native_q1 as q
          import geometry.cad_import.mesh as g
          assert t.native_available() and e.native_available() and q.native_available() and g.native_available()
          "

      - name: Run tests
        # OpenCASCADE and PyPEEC are base dependencies, so the STEP and voxel
        # PEEC tests run here; only the CUDA and KiCad tests skip.
        run: |
          python -c "from geometry.cad_import import ocp_available; assert ocp_available()"
          pytest tests/ -v --tb=short -rs

  # An editable install on whatever setuptools the runner ships exercises
  # neither the version this project says it needs nor the artefact people
  # actually receive. The package once declared a license form only setuptools
  # 77 understands while requiring 69, and named console scripts pointing at
  # modules the distribution does not contain. Both passed the job above and
  # both would have failed for anyone who installed it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with the oldest supported setuptools
        run: |
          python -m pip install --upgrade pip
          # Pinned to the floor in [build-system].requires, so raising that
          # floor becomes a deliberate edit instead of something a newer
          # runner quietly hides.
          pip install 'setuptools==69.*' wheel build
          python -m build --no-isolation

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl pytest

      - name: Check what the distribution actually ships
        # Run from a directory holding no source, so a module missing from the
        # wheel cannot be masked by the checkout sitting on sys.path.
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python -c "
          import electrical
          from electrical.dice_peec import MultilayerDeltaScorer, Stackup, ViaSpec, ViaSet
          from electrical.matrix_free_mpir_fem import (
              MatrixFreePCBOperator, solve_pcb_dc, solve_scalar_maxwell
          )
          from electrical.dice_peec.cli import calibrate
          from thermal.matrix_free_mpir_fem import (
              solve_thermal_conduction, element_joule_heat_w
          )
          from emc.tiled_dipole_superposition import far_field_pattern, CISPR32_CLASS_B
          from multiphysics.staggered_coupling import run_scenario, ElectroThermalScenario
          from geometry.cad_import import BodyMap, rasterize_board, voxelize_bodies, ocp_available
          assert callable(calibrate.main)
          assert callable(rasterize_board) and callable(voxelize_bodies) and ocp_available()
          assert callable(MultilayerDeltaScorer)
          assert callable(solve_pcb_dc)
          assert callable(solve_scalar_maxwell)
          assert callable(solve_thermal_conduction)
          assert callable(element_joule_heat_w)
          assert callable(far_field_pattern)
          assert CISPR32_CLASS_B.bands
          assert callable(run_scenario) and callable(ElectroThermalScenario)
          "
          # Every console script the metadata promises has to run.
          /tmp/wheel-env/bin/pcb-analysis-calibrate --help > /dev/null
          # The inline-type marker has to survive packaging, not merely exist.
          /tmp/wheel-env/bin/python -c "
          from importlib.resources import files
          assert files('electrical').joinpath('py.typed').is_file()
          assert files('thermal').joinpath('py.typed').is_file()
          assert files('emc').joinpath('py.typed').is_file()
          assert files('multiphysics').joinpath('py.typed').is_file()
          assert files('geometry').joinpath('py.typed').is_file()
          "

      - name: Run the suite against the installed package
        run: /tmp/wheel-env/bin/python -m pytest tests/ -q

      - name: Install the source distribution
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install --upgrade pip
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdist-env/bin/python -c "import electrical.dice_peec, electrical.matrix_free_mpir_fem, thermal.matrix_free_mpir_fem, emc.tiled_dipole_superposition, multiphysics.staggered_coupling, geometry.cad_import"
